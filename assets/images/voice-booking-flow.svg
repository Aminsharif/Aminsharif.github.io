<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="vbTitle vbDesc">
  <title id="vbTitle">AI voice agent booking flow</title>
  <desc id="vbDesc">Three-stage diagram of a booking automation. First an AI voice agent answers inbound calls and chat, detects the caller's intent and reads the requested date and time. Second it checks Google Calendar availability, matches an open slot and creates the booking in a database. Third it updates the CRM record, sends a confirmation and schedules a reminder.</desc>

  <defs>
    <linearGradient id="vbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1836"/>
      <stop offset="0.55" stop-color="#0e2149"/>
      <stop offset="1" stop-color="#172c5e"/>
    </linearGradient>
    <radialGradient id="vbGlow" cx="0.5" cy="0.62" r="0.68">
      <stop offset="0" stop-color="#4a86e0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4a86e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vbDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.25" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <symbol id="i-spark" viewBox="0 0 16 16">
      <path d="M8 2 C8.6 5.4 9.9 6.7 13.3 7.3 C9.9 7.9 8.6 9.2 8 12.6 C7.4 9.2 6.1 7.9 2.7 7.3 C6.1 6.7 7.4 5.4 8 2 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-cal" viewBox="0 0 16 16">
      <rect x="2.2" y="3.4" width="11.6" height="10.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M2.2 6.7 H13.8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5.4 1.9 V4.4 M10.6 1.9 V4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6.1 9.7 L7.5 11.1 L10.2 8.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 16 16">
      <circle cx="8" cy="5.6" r="2.9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M2.6 13.6 C2.6 10.6 5 9 8 9 C11 9 13.4 10.6 13.4 13.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="800" height="450" fill="url(#vbBg)"/>
  <rect width="800" height="450" fill="url(#vbDots)"/>
  <rect width="800" height="450" fill="url(#vbGlow)"/>

  <!-- Header band. Left side is intentionally clear. -->
  <text x="768" y="54" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#e9b85c">AI VOICE AGENT</text>
  <text x="768" y="84" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#eaf0fb">Booking &amp; CRM automation</text>
  <line x1="30" y1="108" x2="770" y2="108" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">

    <!-- Panel 1 — AI VOICE AGENT -->
    <g>
      <rect x="30" y="132" width="228" height="270" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="48" y="152" width="30" height="30" rx="9" fill="#7fb0ff" fill-opacity="0.14" stroke="#7fb0ff" stroke-opacity="0.28"/>
      <use xlink:href="#i-spark" href="#i-spark" x="55" y="159" width="16" height="16" style="color:#9cc4ff"/>
      <text x="88" y="172" font-size="13.5" font-weight="600" letter-spacing="1.4" fill="#8fb4ee">AI VOICE AGENT</text>
      <line x1="48" y1="198" x2="240" y2="198" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="56" cy="233" r="2.8" fill="#6f9ae0"/>
      <text x="70" y="238" font-size="14.5" font-weight="600" fill="#e9effb">Answers calls &amp; chat</text>
      <text x="70" y="256" font-size="12" fill="#8098c4">Voice &amp; web</text>
      <circle cx="56" cy="293" r="2.8" fill="#6f9ae0"/>
      <text x="70" y="298" font-size="14.5" font-weight="600" fill="#e9effb">Detects intent</text>
      <text x="70" y="316" font-size="12" fill="#8098c4">NLP</text>
      <circle cx="56" cy="353" r="2.8" fill="#6f9ae0"/>
      <text x="70" y="358" font-size="14.5" font-weight="600" fill="#e9effb">Reads date &amp; time</text>
      <text x="70" y="376" font-size="12" fill="#8098c4">Scheduling</text>
    </g>

    <!-- Panel 2 — BOOKING -->
    <g>
      <rect x="286" y="132" width="228" height="270" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="304" y="152" width="30" height="30" rx="9" fill="#7fb0ff" fill-opacity="0.14" stroke="#7fb0ff" stroke-opacity="0.28"/>
      <use xlink:href="#i-cal" href="#i-cal" x="311" y="159" width="16" height="16" style="color:#9cc4ff"/>
      <text x="344" y="172" font-size="13.5" font-weight="600" letter-spacing="1.4" fill="#8fb4ee">BOOKING</text>
      <line x1="304" y1="198" x2="496" y2="198" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="312" cy="233" r="2.8" fill="#6f9ae0"/>
      <text x="326" y="238" font-size="14.5" font-weight="600" fill="#e9effb">Checks Google Calendar</text>
      <text x="326" y="256" font-size="12" fill="#8098c4">Availability</text>
      <circle cx="312" cy="293" r="2.8" fill="#6f9ae0"/>
      <text x="326" y="298" font-size="14.5" font-weight="600" fill="#e9effb">Matches the open slot</text>
      <text x="326" y="316" font-size="12" fill="#8098c4">Scheduling logic</text>
      <circle cx="312" cy="353" r="2.8" fill="#e9b85c"/>
      <text x="326" y="358" font-size="14.5" font-weight="600" fill="#e9effb">Creates the booking</text>
      <text x="326" y="376" font-size="12" fill="#8098c4">Database</text>
    </g>

    <!-- Panel 3 — CRM & FOLLOW-UP -->
    <g>
      <rect x="542" y="132" width="228" height="270" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="560" y="152" width="30" height="30" rx="9" fill="#7fb0ff" fill-opacity="0.14" stroke="#7fb0ff" stroke-opacity="0.28"/>
      <use xlink:href="#i-user" href="#i-user" x="567" y="159" width="16" height="16" style="color:#9cc4ff"/>
      <text x="600" y="172" font-size="13.5" font-weight="600" letter-spacing="1.4" fill="#8fb4ee">CRM &amp; FOLLOW-UP</text>
      <line x1="560" y1="198" x2="752" y2="198" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="568" cy="233" r="2.8" fill="#6f9ae0"/>
      <text x="582" y="238" font-size="14.5" font-weight="600" fill="#e9effb">Updates the CRM record</text>
      <text x="582" y="256" font-size="12" fill="#8098c4">HubSpot</text>
      <circle cx="568" cy="293" r="2.8" fill="#6f9ae0"/>
      <text x="582" y="298" font-size="14.5" font-weight="600" fill="#e9effb">Sends confirmation</text>
      <text x="582" y="316" font-size="12" fill="#8098c4">Email &amp; SMS</text>
      <circle cx="568" cy="353" r="2.8" fill="#6f9ae0"/>
      <text x="582" y="358" font-size="14.5" font-weight="600" fill="#e9effb">Sets a reminder</text>
      <text x="582" y="376" font-size="12" fill="#8098c4">Follow-up</text>
    </g>
  </g>

  <!-- Flow arrows between panels -->
  <g fill="none" stroke="#6f9ae0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="272" cy="267" r="11" fill="#4a86d0" fill-opacity="0.16" stroke="none"/>
    <circle cx="528" cy="267" r="11" fill="#4a86d0" fill-opacity="0.16" stroke="none"/>
    <path d="M265 267 h14 m-5 -5 l5 5 l-5 5"/>
    <path d="M521 267 h14 m-5 -5 l5 5 l-5 5"/>
  </g>
</svg>
